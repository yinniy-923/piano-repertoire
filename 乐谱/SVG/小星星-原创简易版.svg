<text x="105" y="438">右手：每小节前两音各二拍；第 4、8 小节的 G5、C5 各保持四拍。</text>
<text x="105" y="465">左手：每小节弹一个低音提示（音符名称见上方标记），熟悉后可改为和弦。</text>
<text x="105" y="492">原创教学简谱式五线谱示意，供入门练习；非出版乐谱或任何考级机构官方版本。</text>
